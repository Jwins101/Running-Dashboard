name: Sync Garmin data

on:
  schedule:
    # 11:00 UTC daily (~7am Eastern) — edit the cron to taste
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cached Garmin tokens (from a previous run's refresh)
        id: cache-tokens
        uses: actions/cache/restore@v4
        with:
          path: garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: |
            garmin-tokens-

      - name: Bootstrap tokens from secret (first run / cache miss only)
        if: steps.cache-tokens.outputs.cache-matched-key == ''
        run: |
          echo "No cached tokens found — bootstrapping from GARMIN_TOKENS_B64 secret"
          echo "${{ secrets.GARMIN_TOKENS_B64 }}" | base64 -d > garmin_tokens.zip
          mkdir -p garmin_tokens_raw
          unzip -o garmin_tokens.zip -d garmin_tokens_raw || true
          mkdir -p garmin_tokens
          FOUND=$(find garmin_tokens_raw -iname "garmin_tokens.json" | head -n1)
          if [ -z "$FOUND" ]; then
            echo "Could not find garmin_tokens.json inside the archive" >&2
            find garmin_tokens_raw
            exit 1
          fi
          cp "$FOUND" garmin_tokens/garmin_tokens.json
          echo "Bootstrapped token file from secret"

      - name: Run sync
        env:
          GARMIN_TOKEN_DIR: garmin_tokens
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python sync_garmin.py --out data.json

      - name: Save refreshed Garmin tokens for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: garmin_tokens
          key: garmin-tokens-${{ github.run_id }}

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet --cached || git commit -m "Sync Garmin data"
          git push
